name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  workflow:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Rebuild workflow from src/nodes
        run: node scripts/build-workflow.mjs
      - name: Committed workflow must match the build
        run: git diff --exit-code -- workflows/call-recording-to-crm.json
      - name: Node code and workflow wiring tests
        run: node --test
      - name: Offline evaluation on the recorded sample outputs
        run: npm run eval

  service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Path guard tests
        run: python -m unittest discover -s tests -v
